<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forge IA — Project Manager</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><div class="logo">FORGE <i></i> IA</div><div><b>Project Manager</b><small>Socle serveur multi-projet</small></div><span id="health">Connexion…</span></header>
  <main>
    <aside>
      <div class="heading"><b>Projets</b><button id="showCreate">＋</button></div>
      <div id="projects"></div>
    </aside>
    <section class="empty" id="empty"><span>◇</span><h1>Sélectionne un projet</h1><p>Chaque projet possède sa conversation, son coût et son espace de travail.</p></section>
    <section class="project-view hidden" id="view">
      <div class="project-head"><div><small id="slug"></small><h1 id="name"></h1><p id="description"></p></div><div><span class="status" id="status"></span><button id="toggleRuntime"></button><button id="checkpoint">Créer un checkpoint</button></div></div>
      <div class="metrics"><article><small>Coût total</small><b id="cost">$0.00</b></article><article><small>Exécutions</small><b id="runCount">0</b></article><article><small>Dernière activité</small><b id="lastActivity">—</b></article></div>
      <div class="content"><div class="conversation"><h2>Conversation</h2><div id="messages"></div><form id="promptForm"><textarea id="prompt" placeholder="Décris la prochaine modification…" required></textarea><button>Exécuter →</button></form></div><div class="runs"><h2>Exécutions</h2><div id="runs"></div></div></div>
    </section>
  </main>
  <dialog id="createDialog"><form id="createForm"><button class="close" type="button">×</button><small>NOUVEAU PROJET</small><h2>Créer un espace isolé</h2><label>Nom<input name="name" required placeholder="Aura DEXA"></label><label>Description<textarea name="description" placeholder="Landing page premium pour un centre DEXA"></textarea></label><button class="primary">Créer le projet</button></form></dialog>
  <script src="/app.js"></script>
</body>
</html>
