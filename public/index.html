<section class="preview-panel" id="previewPanel">
  <div class="preview-toolbar">
    <div>
      <span class="preview-dot"></span>
      <b>Prévisualisation</b>
    </div>

    <div class="preview-actions">
      <button id="refreshPreview" type="button">
        Actualiser
      </button>

      <button id="openPreview" type="button">
        Ouvrir dans un onglet
      </button>
    </div>
  </div>

  <div class="preview-browser">
    <div class="preview-address">
      <span>🔒</span>
      <span id="previewAddress">Aucun projet</span>
    </div>

    <iframe
      id="previewFrame"
      title="Prévisualisation du projet"
      sandbox="allow-scripts allow-forms allow-modals"
    ></iframe>
  </div>
</section>
